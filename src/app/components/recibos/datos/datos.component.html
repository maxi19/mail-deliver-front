
<div class="container">
  <mat-stepper linear #stepper >
    <mat-step [stepControl]="firstFormGroup" [editable]="true">
      <form [formGroup]="firstFormGroup">
        <ng-template matStepLabel>Subida de archivos</ng-template>
            <app-recibos-upload></app-recibos-upload>
          <button mat-button matStepperNext class="btn btn-primary" >siguiente</button>
      </form>
    </mat-step>
    <mat-step [stepControl]="secondFormGroup" [editable]="true" [optional]="false"  [completed]="false">
      <form [formGroup]="secondFormGroup">
        <ng-template matStepLabel>Seleccione operacion</ng-template>
        <div class="row mt-2">
          <div class="input-group">
            <mat-form-field >
              <mat-label>Seleccione un personal</mat-label>
              <div class="input-group-prepend">
                <input type="text"
                       placeholder="Personal"
                       matInput
                       formControlName="myControl"
                       [matAutocomplete]="auto" >
                
                <mat-autocomplete #auto="matAutocomplete"   [displayWith]="getEmail.bind(this)" >
                    <mat-option [value]="option.completo" *ngFor="let option of filteredOptions | async; track option"  >{{option.completo}}</mat-option>
                </mat-autocomplete>
              </div>
            </mat-form-field>
            <button class="form-control" mat-stroked-button (click) ="agregarCard()" >Agregar profesional</button>
  
          </div>
        </div>
        
        <div class="row">

          <div class="col-lg-4" cdkDropList [cdkDropListData]="personalesSeleccionados" *ngIf="personalesSeleccionados.length > 0 " (cdkDropListDropped)="dropP($event)" >
            <mat-card  *ngFor="let prSeleccionado of personalesSeleccionados; let i = index;" cdkDrag >
              <mat-card-header>
                <div mat-card-avatar class="example-header-image"></div>
                <mat-card-title>{{prSeleccionado.apellidos}}, {{prSeleccionado.nombres}} </mat-card-title>
                <mat-card-subtitle>{{prSeleccionado.email}}</mat-card-subtitle>
              </mat-card-header> 
              <mat-card-content>
                <input type="hidden" value = "'{{i+1}}'">
                <input type="button" value="Agregar documentos" (enviarRecibo)="recibirRecibos($event)"  (click)="agregarDocumentosModal(prSeleccionado)"    class="btn btn-danger m-2">
                <input type="button" value="Remover" (click)="removerCard(i)"   class="btn btn-danger m-2">
              </mat-card-content>
            </mat-card>
          </div>
  
          <div class="col" *ngIf="(mostrarRecibos)">

           <app-file-grilla  [filesEnBase]="filesEnBase"></app-file-grilla>

          </div>

          <div class="alert alert-info" *ngIf="personalesSeleccionados.length == 0" role="alert">
            No hay personal agregados en la grilla
          </div>

        </div>
        <div>
          <button mat-button matStepperPrevious>Back</button>
          <button mat-button matStepperNext>Next</button>
        </div>
      </form>
    </mat-step >
    <mat-step [optional]="false"  [completed]="false">
      <ng-template matStepLabel>Done </ng-template>


      
      <app-recibo-en-bandeja></app-recibo-en-bandeja>

      <div>
        <button mat-button matStepperPrevious>Back</button>
        <button mat-button (click)="stepper.reset()">Reset</button>
      </div>
    </mat-step>
  </mat-stepper>
  
  
  <!-- The Modal -->
  <div class="modal fade" id="myModal" tabindex="-1" >
    <div class="modal-dialog">
      <div class="modal-content">
  
        <!-- Modal Header -->
        <div class="modal-header">
          <h4 class="modal-title">Confirmacion de Envio</h4>
          <button type="button" class="btn-close" data-dismiss="modal"></button>
        </div>
  
        <!-- Modal body -->
        <div class="modal-body">
          <div class="container">
            <table class="table table-dark">
              <thead>
                <tr>
                  <th scope="col">Email</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let recib of recibosIdentificadosList; let i = index">
                  <igx-expansion-panel>
                    <igx-expansion-panel-header>
                      <igx-expansion-panel-title>
                        <h6>{{recib.email}} </h6>
                        <button (click)="enviarRecibosDocente(recib)" type="button"
                           class="btn btn-success">Enviar</button>
                      </igx-expansion-panel-title>
                    </igx-expansion-panel-header>
  
                    <igx-expansion-panel-body *ngFor="let item of recib.itemDto">
                      <td>
                        {{item.archivo}}
                      </td>
                    </igx-expansion-panel-body>
                  </igx-expansion-panel>
                </tr>
              </tbody>
            </table>
          </div>
  
  
        </div>
  
        <!-- Modal footer -->
        <div class="modal-footer">
          <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

</div>
